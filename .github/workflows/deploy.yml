name: Deploy

on:
  # Only main pushes deploy; branch pushes would duplicate the pull_request run,
  # which lands in a different concurrency group and so is not deduplicated.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  # Superseded PR runs are wasted work; a main run is a deploy and must finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and Test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests (Vitest)
        run: npm test

      - name: Functions tests (Vitest)
        run: npm run test:functions

      - name: Generate build-time assets
        run: |
          npm run generate:version
          npm run generate:userscript

      # Built before the E2E run and unconditionally: cloudflare-pages-offline.spec.ts
      # reads dist/hnews-cf from disk, so the suite exercises the bytes that ship.
      # The Cloudflare secrets gate deploying, not building.
      - name: Build production bundle for Cloudflare Pages
        run: |
          npm run build:e2e
          cp -r functions dist/hnews-cf/
          rm -rf dist/hnews-cf/functions/__tests__

      # e2e:gh serves the app with `ng serve` instead of the default wrangler
      # web server. workerd has repeatedly died part-way through the suite here,
      # failing every remaining test with a refused connection. Nothing is lost:
      # the only suite that exercises Pages behaviour (_headers, offline boot)
      # is cloudflare-pages-offline.spec.ts, which serves dist/hnews-cf from its
      # own Node server and ignores the Playwright web server.
      #
      # xvfb provides the display that suite needs: it launches a headed
      # Chromium because standalone display mode is not exposed headless.
      - name: E2E tests (Playwright Chromium)
        run: xvfb-run -a npm run e2e:gh -- --project=chromium

      # Built after E2E because its base href differs from the deployed
      # Cloudflare bundle, so it cannot be the bundle the suite tests.
      - name: Build production bundle for GitHub Pages
        run: |
          # Determine base href for GitHub Pages based on repository
          if [ "${{ github.repository }}" = "alysson-souza/hnews" ]; then
            GH_BASE_HREF="/hnews/"
          else
            # For forks, use the repository name
            REPO_NAME="${{ github.event.repository.name }}"
            GH_BASE_HREF="/${REPO_NAME}/"
          fi

          echo "Building GitHub Pages bundle with base-href: $GH_BASE_HREF"
          npx ng build --configuration production --base-href "$GH_BASE_HREF" --output-path dist/hnews-gh
          node ./scripts/patch-ngsw.mjs

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/hnews-gh/browser

      - name: Upload Cloudflare Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: |
            dist/hnews-cf/browser
            dist/hnews-cf/functions
            wrangler.toml

  deploy-github:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Download Cloudflare Pages artifact
        if: env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages
          path: cf-artifact

      - name: Prepare Cloudflare deployment directory
        if: env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          # Static assets go in cf-dist (matches pages_build_output_dir)
          mkdir -p cf-dist
          cp -r cf-artifact/dist/hnews-cf/browser/* cf-dist/

          # Functions go at root level, NOT inside cf-dist
          # (Cloudflare requires functions/ at project root, separate from static assets)
          cp -r cf-artifact/dist/hnews-cf/functions .

          # Copy wrangler.toml to current directory for config
          cp cf-artifact/wrangler.toml .

      - name: Publish to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler pages deploy --project-name=${CF_PAGES_PROJECT_NAME:-hnews} --branch=${{ github.ref_name }}
