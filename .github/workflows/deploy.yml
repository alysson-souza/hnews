name: Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js from .node-version
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests (Vitest)
        run: npm test

      - name: Functions tests (Vitest)
        run: npm run test:functions

      - name: Generate build-time assets
        run: |
          npm run generate:version
          npm run generate:userscript

      # The E2E run needs a bundle served at the site root: the Playwright web
      # server serves this one, and the offline-boot suite reads it from disk.
      # Neither deploy bundle works here - dist/hnews-gh is built with a GitHub
      # Pages base href, and dist/hnews-cf is only built when the Cloudflare
      # secrets are set. Built before the deploy bundles so the suite fails the
      # job without waiting on two production builds.
      - name: Build bundle for E2E
        run: |
          npx ng build --configuration production --base-href "/"
          node ./scripts/patch-ngsw.mjs

      # PLAYWRIGHT_WEBSERVER_COMMAND replaces the default `start:cf:offline`,
      # which rebuilds the app with `ng build --watch` while wrangler serves it.
      # That build competes with the tests for the runner's cores and has killed
      # workerd mid-suite, failing every remaining test with a refused
      # connection. Serving the bundle built above needs no rebuild.
      #
      # xvfb provides the display the offline-boot suite needs: it launches a
      # headed Chromium because standalone display mode is not exposed headless.
      - name: E2E tests (Playwright Chromium)
        env:
          PLAYWRIGHT_WEBSERVER_COMMAND: npx wrangler pages dev dist/hnews/browser --port 8788
        run: xvfb-run -a npm run e2e:chromium

      - name: Build production bundle for GitHub Pages
        run: |
          # Determine base href for GitHub Pages based on repository
          if [ "${{ github.repository }}" = "alysson-souza/hnews" ]; then
            GH_BASE_HREF="/hnews/"
          else
            # For forks, use the repository name
            REPO_NAME="${{ github.event.repository.name }}"
            GH_BASE_HREF="/${REPO_NAME}/"
          fi

          echo "Building GitHub Pages bundle with base-href: $GH_BASE_HREF"
          npx ng build --configuration production --base-href "$GH_BASE_HREF" --output-path dist/hnews-gh
          node ./scripts/patch-ngsw.mjs

      - name: Build production bundle for Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          echo "Building Cloudflare Pages bundle with base-href: /"
          npx ng build --configuration production --base-href "/" --output-path dist/hnews-cf
          node ./scripts/patch-ngsw.mjs
          cp -r functions dist/hnews-cf/
          rm -rf dist/hnews-cf/functions/__tests__

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/hnews-gh/browser

      - name: Upload Cloudflare Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: |
            dist/hnews-cf/browser
            dist/hnews-cf/functions
            wrangler.toml

  deploy-github:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - name: Download Cloudflare Pages artifact
        if: env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages
          path: cf-artifact

      - name: Prepare Cloudflare deployment directory
        if: env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          # Static assets go in cf-dist (matches pages_build_output_dir)
          mkdir -p cf-dist
          cp -r cf-artifact/dist/hnews-cf/browser/* cf-dist/

          # Functions go at root level, NOT inside cf-dist
          # (Cloudflare requires functions/ at project root, separate from static assets)
          cp -r cf-artifact/dist/hnews-cf/functions .

          # Copy wrangler.toml to current directory for config
          cp cf-artifact/wrangler.toml .

      - name: Publish to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx wrangler pages deploy --project-name=${CF_PAGES_PROJECT_NAME:-hnews} --branch=${{ github.ref_name }}
